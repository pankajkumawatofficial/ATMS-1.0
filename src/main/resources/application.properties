spring.application.name=ATM Banking API

# -----------------------------------------------------------------------------
# MySQL connection
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/atm_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=pankaj1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update keeps the schema in sync with the @Entity classes.
# In production you would use a migration tool such as Flyway instead.
# -----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080
